# Que Spring no pause los contextos de prueba que tiene en caché.
#
# Desde Spring Framework 7, al cambiar de un contexto a otro el TestContext framework
# detiene (SmartLifecycle.stop) el que deja de usarse y lo vuelve a arrancar cuando una
# prueba lo reutiliza. Axon 4 no sobrevive a eso: al detenerse cierra su
# AxonServerConnectionManager y, al reanudarse, cualquier conexión nueva falla con
# "Connector is already shut down". Pasaba cada vez que un @SpringBootTest completo
# corría antes que KafkaOutageIntegrationTest (que crea otro contexto) y otro
# @SpringBootTest lo reutilizaba después. Por eso se excluía contextLoads en la CI.
#
# Con NEVER los contextos en caché siguen vivos hasta que termina la JVM, como antes
# de Spring 7.
spring.test.context.cache.pause=never
