name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test and coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: vankoo_finance_db_dev
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U admin -d vankoo_finance_db_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
      axonserver:
        image: axoniq/axonserver:latest
        env:
          AXONIQ_AXONSERVER_STANDALONE: "true"
        ports:
          - 8024:8024
          - 8124:8124
      kafka:
        image: apache/kafka:4.1.1
        ports:
          - 9092:9092

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Wait for Axon Server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8024/actuator/health && exit 0
            sleep 2
          done
          echo "Axon Server did not start" && exit 1

      - name: Build and test
        run: ./mvnw -B verify